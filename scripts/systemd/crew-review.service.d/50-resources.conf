# Resource limits for crew-review.service (crew-services #10379).
# scripts/deploy-crew-services.sh installs this as
# ~/.config/systemd/user/crew-review.service.d/50-resources.conf.
#
# The reviewer's Codex app-server and everything a reviewer runs (tests,
# builds) are children of this unit, so these limits cover them too.
# Evidence from den-agents (56 GB RAM), `journalctl --user -u crew-review |
# grep "memory peak"`, Sep 28 - Oct 29 2026, pool capacity 2-4:
#   - most runs peak at 0.2-1.4 GB; multi-day runs 6-22 GB, swap <= 1.5 GB
#     (cgroup memory includes reclaimable page cache from checkouts and builds)
#   - Oct 7: one reviewer-run test suite reached 49.9 GB RAM + 78.8 GB swap.
[Service]
# Above every normal peak: throttle and reclaim (page cache first), never kill.
MemoryHigh=20G
# Hard backstop, leaving about half the box to the owner and other agents.
# The kernel OOM killer then picks the largest process in the unit, normally
# the runaway test, not crew-review itself.
MemoryMax=28G
# Stops the 78.8 GB swap blowup; normal swap peaks stay under 1.5 GB.
MemorySwapMax=4G
# Killing one runaway child must not stop crew-review and its other reviews
# (the default OOMPolicy=stop would stop the whole unit).
OOMPolicy=continue
# Reviewers yield CPU to interactive agents under contention (default 100).
CPUWeight=50
