# Lore's DSH on den-lore: model routes copied from den-agents' web profile
# (keys are in ../../.credentials.yaml). Everything else is upstream's default.
# The host runs as a background task with no desktop, so the native folder
# picker cannot open; the browser's own picker is used instead.
- id: directory-picker
  disabled: true
- insert:
  - id: directory-picker-browse
    name: '@deepseek-ai/dsh-host-directory-picker-browse'
  - id: ui-directory-picker-browse
    name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
- id: subagent-model-selection-settings
  name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'
  config:
    enabled: true
    allowedModels:
    - provider: deepseek-official
      model: deepseek-flash
    - provider: meta
      model: muse-spark-1.3-contributor
    - provider: zai
      model: glm-5.3-flash
    - provider: local
      model: qwen-flash-next-pwilkin-iq4
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      openrouter:
        apiKeyEnv: OPENROUTER_API_KEY
        api: openai-completions
        models:
        - id: google/gemini-4-argon
          name: Gemini 4 Argon
          contextWindow: 1048576
          maxTokens: 65536
          input:
          - text
          - image
          reasoningEfforts:
            'off': null
            low: low
            medium: medium
            high: high
      meta:
        displayName: meta
        apiKeyEnv: META_API_KEY
        api: openai-responses
        baseURL: https://api.meta.ai/v1
        models:
        - id: muse-spark-1.3-contributor
          contextWindow: 1000000
          input:
          - text
          - image
          reasoningEfforts:
            high: high
            xhigh: xhigh
      zai:
        baseURL: https://api.z.ai/api/coding/paas/v4
        models:
        - id: glm-5.3-flash
          name: glm-5.3-flash
          contextWindow: 1000000
          maxTokens: 125000
          input: []
          reasoningEfforts:
            'off': null
            high: high
            max: max
        apiKeyEnv: ZAI_API_KEY
      local:
        api: openai-completions
        baseURL: http://192.168.1.24:8090/v1
        models:
        - id: qwen-flash-next-pwilkin-iq4
          name: qwen-flash-next-pwilkin-iq4
          input: []
          reasoningEfforts:
            'off': null
            medium: medium
            xhigh: xhigh
        apiKeyEnv: LOCAL_API_KEY
      xiaomi:
        apiKeyEnv: XIAOMI_API_KEY
        models:
        - id: mimo-v2.6-pro
          contextWindow: 1000000
          maxTokens: 120000
          input:
          - text
          - image
          reasoningEfforts:
            'off': null
            high: high
            max: max
        - id: mimo-v2.6-flash
          contextWindow: 1000000
          maxTokens: 100000
          input:
          - text
          - image
          reasoningEfforts:
            'off': null
            high: high
            max: max
      local-patch:
        apiKeyEnv: LOCAL_PATCH_API_KEY
        api: openai-completions
        baseURL: http://192.168.1.20:13305/v1
        models:
        - id: Qwen3.8-27B-GGUF
          input:
          - text
          - image
          reasoningEfforts:
            low: low
            medium: medium
            xhigh: xhigh
      anthropic:
        apiKeyEnv: ANTHROPIC_API_KEY
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY
      xai:
        apiKeyEnv: XAI_API_KEY
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: max
